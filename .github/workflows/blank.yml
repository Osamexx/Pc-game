name: Virtual PC Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Digite a senha para o usuário (ou deixe em branco)'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Máximo possível no GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Instalar Servidor de Área de Trabalho e Ferramentas
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies tightvncserver dbus-x11

      - name: Instalar o Ngrok
        uses: ngrok/ngrok-action@v1
        with:
          auth-token: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Configurar e Iniciar Servidor VNC
        run: |
          mkdir -p \~/.vnc
          echo "${{ github.event.inputs.access_password }}" | vncpasswd -f > \~/.vnc/passwd
          chmod 600 \~/.vnc/passwd
          
          # Configuração do xstartup para iniciar o XFCE
          cat > \~/.vnc/xstartup << EOF
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XKL_XMODMAP_DISABLE=1
          startxfce4 &
          EOF
          
          chmod +x \~/.vnc/xstartup
          
          # Inicia o VNC na display :1 (porta 5901)
          vncserver :1 -geometry 1920x1080 -depth 24
          
          echo "VNC Server iniciado na porta 5901"

      - name: Expor porta com Ngrok (TCP)
        run: |
          ngrok tcp 5901 --log=stdout &
          sleep 8
          
          # Mostra a URL pública no log
          curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'tcp://[^"]*' || true
          echo ""
          echo "=============================================="
          echo " PC Virtual pronto! Use um cliente VNC (como RealVNC, TightVNC ou TigerVNC)"
          echo " Conecte usando o endereço que aparecer acima (ex: 0.tcp.ngrok.io:xxxxx)"
          echo " Usuário: runner"
          echo " Senha: a que você digitou no início"
          echo "=============================================="

      - name: Manter a máquina ligada
        run: sleep infinity
